<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <!-- =========================================
       DEFAULT TITLE
       Firebase site-settings.js can replace this
  ========================================== -->

  <title>Imaginary Gifts - Customized Gifts</title>


  <!-- =========================================
       DEFAULT META DESCRIPTION
       Firebase site-settings.js can replace this
  ========================================== -->

  <meta
    name="description"
    content="Customized gifts from Imaginary Gifts"
  >


  <!-- =========================================
       OPEN GRAPH
  ========================================== -->

  <meta
    property="og:title"
    content="Imaginary Gifts - Customized Gifts"
  >

  <meta
    property="og:description"
    content="Customized gifts from Imaginary Gifts"
  >

  <meta
    property="og:image"
    content=""
  >

  <meta
    property="og:url"
    content=""
  >

  <meta
    property="og:type"
    content="product"
  >


  <!-- =========================================
       VIEWPORT
  ========================================== -->

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <!-- =========================================
       STORE CSS
  ========================================== -->

  <link
    rel="stylesheet"
    href="css/store.css"
  >
<link
    rel="stylesheet"
    href="css/topbar.css"
  >
</head>


<body>


<!-- ==================================================
     TOPBAR
================================================== -->

<header class="site-topbar">

    <!-- MENU BUTTON -->

    <button
        type="button"
        class="topbar-button menu-button"
        id="menuButton"
        aria-label="Open menu"
        aria-expanded="false"
    >
        <i class="fa-solid fa-bars"></i>
    </button>


    <!-- LOGO -->

    <div class="topbar-logo">

        <a
            href="index"
            id="logoLink"
            data-logo-link
            aria-label="Home"
        >

            <img
                id="siteLogo"
                data-site-logo
                src=""
                alt="Company Logo"
            >

        </a>

    </div>


    <!-- SEARCH BUTTON -->

    <button
        type="button"
        class="topbar-button search-button"
        id="searchButton"
        aria-label="Search"
    >
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>

</header>



<!-- ==================================================
     SEARCH OVERLAY
     HIDDEN UNTIL SEARCH BUTTON IS CLICKED
================================================== -->

<div
    id="searchOverlay"
    class="search-overlay"
    aria-hidden="true"
>

    <div class="search-panel">

        <!-- SEARCH HEADER -->

        <div class="search-header">

            <div class="search-title">
                Search Products
            </div>

            <button
                type="button"
                class="search-close-button"
                id="closeSearchButton"
                aria-label="Close search"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <!-- SEARCH INPUT -->

        <div class="search-input-wrapper">

            <i class="fa-solid fa-magnifying-glass search-input-icon"></i>

            <input
                type="search"
                id="searchInput"
                class="search-input"
                placeholder="Search for products..."
                autocomplete="off"
            >

            <button
                type="button"
                id="clearSearchButton"
                class="clear-search-button"
                aria-label="Clear search"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <!-- SEARCH RESULTS -->

        <div
            id="searchResults"
            class="search-results"
        >

            <div class="search-message">
                Search for a product
            </div>

        </div>

    </div>

</div>



<!-- ==================================================
     SIDEBAR OVERLAY
================================================== -->

<div
    id="sidebarOverlay"
    class="sidebar-overlay"
    aria-hidden="true"
></div>



<!-- ==================================================
     SIDEBAR
================================================== -->

<aside
    id="sidebar"
    class="site-sidebar"
    aria-hidden="true"
>

    <!-- SIDEBAR HEADER -->

    <div class="sidebar-header">

        <strong data-company-name>
            Company Name
        </strong>

        <button
            type="button"
            class="sidebar-close-button"
            id="closeSidebarButton"
            aria-label="Close menu"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>


    <!-- HOME -->

    <a
        href="index"
        class="sidebar-link"
        data-home-link
    >

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>


    <!-- CATEGORIES -->

    <div class="sidebar-expandable">

        <button
            type="button"
            class="sidebar-expand-button"
            id="categoriesToggle"
            aria-expanded="false"
        >

            <span>

                <i class="fa-solid fa-layer-group"></i>

                Categories

            </span>

            <i class="fa-solid fa-chevron-down sidebar-chevron"></i>

        </button>


        <div
            id="sidebarCategories"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">
                Loading categories...
            </div>

        </div>

    </div>


    <!-- TAGS -->

    <div class="sidebar-expandable">

        <button
            type="button"
            class="sidebar-expand-button"
            id="tagsToggle"
            aria-expanded="false"
        >

            <span>

                <i class="fa-solid fa-tags"></i>

                Tags

            </span>

            <i class="fa-solid fa-chevron-down sidebar-chevron"></i>

        </button>


        <div
            id="sidebarTags"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">
                Loading tags...
            </div>

        </div>

    </div>


    <!-- ABOUT -->

    <a
        href="aboutus"
        class="sidebar-link"
    >

        <i class="fa-solid fa-circle-info"></i>

        <span>
            About Us
        </span>

    </a>


    <!-- CONTACT -->

    <a
        href="contact-us"
        class="sidebar-link"
    >

        <i class="fa-solid fa-phone"></i>

        <span>
            Contact Us
        </span>

    </a>


    <!-- TERMS -->

    <a
        href="t&c"
        class="sidebar-link"
    >

        <i class="fa-solid fa-file-contract"></i>

        <span>
            Terms & Conditions
        </span>

    </a>


    <!-- PRIVACY -->

    <a
        href="privacy-policy"
        class="sidebar-link"
    >

        <i class="fa-solid fa-lock"></i>

        <span>
            Privacy Policy
        </span>

    </a>


    <!-- REFUND -->

    <a
        href="refund"
        class="sidebar-link"
    >

        <i class="fa-solid fa-money-bill-transfer"></i>

        <span>
            Refund Policy
        </span>

    </a>


    <!-- SHIPPING -->

    <a
        href="shipping"
        class="sidebar-link"
    >

        <i class="fa-solid fa-truck"></i>

        <span>
            Shipping Policy
        </span>

    </a>

</aside>


<!-- ==================================================
     BACK BAR
================================================== -->

<div class="top-bar custom-topbar">

  <span
    class="back-btn"
    onclick="goBack()"
  >
    ←
  </span>

</div>



<!-- ==================================================
     PRODUCT PAGE
================================================== -->

<div class="product-page">


  <!-- =========================================
       PRODUCT IMAGE SLIDER
  ========================================== -->

  <div
    id="slider"
    class="slider"
  ></div>


  <!-- =========================================
       SLIDER DOTS
  ========================================== -->

  <div
    id="sliderDots"
    class="slider-dots"
  ></div>


  <!-- =========================================
       PRODUCT DETAILS

       product.js renders:

       - Product name
       - Description
       - Price
       - Colors
       - Sizes
       - Custom options
       - Related designs
  ========================================== -->

  <div
    id="productDetails"
    class="product-details"
  ></div>


</div>



<!-- ==================================================
     CUSTOMIZE PRODUCT POPUP
================================================== -->

<div
  id="customizeOverlay"
  class="hidden"
>

  <div class="customize-form">


    <h3>
      Customize Your Product
    </h3>


    <div
      id="customOptionsContainer"
    ></div>


    <!-- =========================================
         POPUP PRICE
    ========================================== -->

    <div class="popup-price">

      Total :

      <span id="popupPrice">
        ₹0
      </span>

    </div>


    <!-- =========================================
         ACTIONS
    ========================================== -->

    <div class="wa-actions">


      <button
        type="button"
        onclick="closeCustomizePopup()"
      >
        Cancel
      </button>


      <button
        type="button"
        onclick="nextToAddress()"
      >
        Next →
      </button>


    </div>


  </div>

</div>



<!-- ==================================================
     WHATSAPP ORDER FORM
================================================== -->

<div
  id="waFormOverlay"
  class="hidden"
>

  <div class="wa-form">


    <h3>
      Enter delivery details
    </h3>


    <!-- =========================================
         CUSTOMER NAME
    ========================================== -->

    <input
      id="custName"
      type="text"
      placeholder="Full Name"
      autocomplete="name"
    >


    <!-- =========================================
         CUSTOMER PHONE
    ========================================== -->

    <input
      id="custPhone"
      type="tel"
      placeholder="Mobile Number"
      inputmode="numeric"
      autocomplete="tel"
    >


    <!-- =========================================
         CUSTOMER ADDRESS
    ========================================== -->

    <textarea
      id="custAddress"
      placeholder="Full Address"
      autocomplete="street-address"
    ></textarea>


    <!-- =========================================
         PINCODE
    ========================================== -->

    <input
      id="custPincode"
      type="tel"
      placeholder="Pincode"
      inputmode="numeric"
      maxlength="6"
      autocomplete="postal-code"
    >


    <!-- =========================================
         ACTIONS
    ========================================== -->

    <div class="wa-actions">


      <button
        type="button"
        onclick="backToCustomize()"
      >
        ← Back
      </button>


      <button
        type="button"
        onclick="submitWaOrder()"
      >
        Continue to WhatsApp
      </button>


    </div>


  </div>

</div>



<!-- ==================================================
     ERROR MODAL
================================================== -->

<div
  id="errorModal"
  class="error-modal hidden"
>

  <div class="error-box">


    <h3>
      Please Fill These First
    </h3>


    <ul
      id="errorList"
    ></ul>


    <button
      type="button"
      onclick="closeErrorModal()"
    >
      OK
    </button>


  </div>

</div>



<!-- ==================================================
     STICKY ORDER BAR
================================================== -->

<div class="sticky-order">


  <!-- =========================================
       WHATSAPP ORDER
  ========================================== -->

  <button
    type="button"
    class="order-btn"
    onclick="orderNow()"
  >
    Order on WhatsApp
  </button>


  <!-- =========================================
       SHARE
  ========================================== -->

  <button
    type="button"
    class="share-btn"
    onclick="sharePage()"
  >
    Share 🔗
  </button>


</div>



<!-- ==================================================
     SITE SETTINGS

     MUST LOAD BEFORE PRODUCT.JS

     Reads:

     settings/general

     and automatically applies:

     - Logo
     - Company name
     - Home URL
     - SEO title
     - Meta description
     - OG tags
================================================== -->

<script
  type="module"
  src="js/site-settings.js"
></script>

<script
  type="module"
  src="js/topbar.js"
></script>


<!-- ==================================================
     PRODUCT JS
================================================== -->

<script
  type="module"
  src="js/product.js"
></script>



<!-- ==================================================
     SHARE JS
================================================== -->

<script
  src="js/share.js"
></script>



<!-- ==================================================
     BACK BUTTON
================================================== -->

<script>

  function goBack(){

    /*
      Always return to homepage.
    */

    location.href = "index";

  }

</script>


</body>

</html>
