<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <!-- =========================================
       DEFAULT TITLE
       Firebase site-settings.js can replace this
  ========================================== -->

  <title>Imaginary Gifts - Customized Gifts</title>


  <!-- =========================================
       DEFAULT META DESCRIPTION
       Firebase site-settings.js can replace this
  ========================================== -->

  <meta
    name="description"
    content="Customized gifts from Imaginary Gifts"
  >


  <!-- =========================================
       OPEN GRAPH
  ========================================== -->

  <meta
    property="og:title"
    content="Imaginary Gifts - Customized Gifts"
  >

  <meta
    property="og:description"
    content="Customized gifts from Imaginary Gifts"
  >

  <meta
    property="og:image"
    content=""
  >

  <meta
    property="og:url"
    content=""
  >

  <meta
    property="og:type"
    content="product"
  >


  <!-- =========================================
       VIEWPORT
  ========================================== -->

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <!-- =========================================
       STORE CSS
  ========================================== -->

  <link
    rel="stylesheet"
    href="css/store.css"
  >

</head>


<body>


<!-- ==================================================
     TOP BAR
================================================== -->

<header class="topbar">


  <!-- =========================================
       MENU
  ========================================== -->

  <div
    class="menu-btn"
    onclick="toggleSidebar()"
  >
    ☰
  </div>


  <!-- =========================================
       LOGO

       IMPORTANT:
       Logo is now loaded from:

       settings/general/logoUrl

       Company name is used automatically
       as alt text by site-settings.js.
  ========================================== -->

  <div class="logo">

    <a
      id="logoLink"
      data-logo-link
      href="index"
      aria-label="Home"
    >

      <img
        id="siteLogo"
        data-site-logo
        src=""
        alt="Company Logo"
      >

    </a>

  </div>


</header>



<!-- ==================================================
     SEARCH OVERLAY
================================================== -->

<div
  id="searchOverlay"
  class="search-overlay"
>

  <input
    type="text"
    id="searchInput"
    placeholder="Search for products..."
  >

</div>



<!-- ==================================================
     SIDEBAR
================================================== -->

<div
  id="sidebar"
  class="sidebar"
>


  <!-- =========================================
       HOME

       data-home-link allows Firebase/site
       settings system to control the home link.
  ========================================== -->

  <a
    id="homeLink"
    data-home-link
    href="index"
  >
    🏠 Home
  </a>


  <!-- =========================================
       STATIC PAGE LINKS
  ========================================== -->

  <a href="aboutus">
    ℹ️ About Us
  </a>


  <a href="contact-us">
    📞 Contact Us
  </a>


  <a href="t&c">
    📜 Terms & Conditions
  </a>


  <a href="privacy-policy">
    🔒 Privacy Policy
  </a>


  <a href="refund">
    💸 Refund Policy
  </a>


  <a href="shipping">
    🚚 Shipping Policy
  </a>


</div>



<!-- ==================================================
     SIDEBAR OVERLAY
================================================== -->

<div
  id="overlay"
  class="overlay"
  onclick="toggleSidebar()"
></div>



<!-- ==================================================
     BACK BAR
================================================== -->

<div class="top-bar custom-topbar">

  <span
    class="back-btn"
    onclick="goBack()"
  >
    ←
  </span>

</div>



<!-- ==================================================
     PRODUCT PAGE
================================================== -->

<div class="product-page">


  <!-- =========================================
       PRODUCT IMAGE SLIDER
  ========================================== -->

  <div
    id="slider"
    class="slider"
  ></div>


  <!-- =========================================
       SLIDER DOTS
  ========================================== -->

  <div
    id="sliderDots"
    class="slider-dots"
  ></div>


  <!-- =========================================
       PRODUCT DETAILS

       product.js renders:

       - Product name
       - Description
       - Price
       - Colors
       - Sizes
       - Custom options
       - Related designs
  ========================================== -->

  <div
    id="productDetails"
    class="product-details"
  ></div>


</div>



<!-- ==================================================
     CUSTOMIZE PRODUCT POPUP
================================================== -->

<div
  id="customizeOverlay"
  class="hidden"
>

  <div class="customize-form">


    <h3>
      Customize Your Product
    </h3>


    <div
      id="customOptionsContainer"
    ></div>


    <!-- =========================================
         POPUP PRICE
    ========================================== -->

    <div class="popup-price">

      Total :

      <span id="popupPrice">
        ₹0
      </span>

    </div>


    <!-- =========================================
         ACTIONS
    ========================================== -->

    <div class="wa-actions">


      <button
        type="button"
        onclick="closeCustomizePopup()"
      >
        Cancel
      </button>


      <button
        type="button"
        onclick="nextToAddress()"
      >
        Next →
      </button>


    </div>


  </div>

</div>



<!-- ==================================================
     WHATSAPP ORDER FORM
================================================== -->

<div
  id="waFormOverlay"
  class="hidden"
>

  <div class="wa-form">


    <h3>
      Enter delivery details
    </h3>


    <!-- =========================================
         CUSTOMER NAME
    ========================================== -->

    <input
      id="custName"
      type="text"
      placeholder="Full Name"
      autocomplete="name"
    >


    <!-- =========================================
         CUSTOMER PHONE
    ========================================== -->

    <input
      id="custPhone"
      type="tel"
      placeholder="Mobile Number"
      inputmode="numeric"
      autocomplete="tel"
    >


    <!-- =========================================
         CUSTOMER ADDRESS
    ========================================== -->

    <textarea
      id="custAddress"
      placeholder="Full Address"
      autocomplete="street-address"
    ></textarea>


    <!-- =========================================
         PINCODE
    ========================================== -->

    <input
      id="custPincode"
      type="tel"
      placeholder="Pincode"
      inputmode="numeric"
      maxlength="6"
      autocomplete="postal-code"
    >


    <!-- =========================================
         ACTIONS
    ========================================== -->

    <div class="wa-actions">


      <button
        type="button"
        onclick="backToCustomize()"
      >
        ← Back
      </button>


      <button
        type="button"
        onclick="submitWaOrder()"
      >
        Continue to WhatsApp
      </button>


    </div>


  </div>

</div>



<!-- ==================================================
     ERROR MODAL
================================================== -->

<div
  id="errorModal"
  class="error-modal hidden"
>

  <div class="error-box">


    <h3>
      Please Fill These First
    </h3>


    <ul
      id="errorList"
    ></ul>


    <button
      type="button"
      onclick="closeErrorModal()"
    >
      OK
    </button>


  </div>

</div>



<!-- ==================================================
     STICKY ORDER BAR
================================================== -->

<div class="sticky-order">


  <!-- =========================================
       WHATSAPP ORDER
  ========================================== -->

  <button
    type="button"
    class="order-btn"
    onclick="orderNow()"
  >
    Order on WhatsApp
  </button>


  <!-- =========================================
       SHARE
  ========================================== -->

  <button
    type="button"
    class="share-btn"
    onclick="sharePage()"
  >
    Share 🔗
  </button>


</div>



<!-- ==================================================
     SITE SETTINGS

     MUST LOAD BEFORE PRODUCT.JS

     Reads:

     settings/general

     and automatically applies:

     - Logo
     - Company name
     - Home URL
     - SEO title
     - Meta description
     - OG tags
================================================== -->

<script
  type="module"
  src="js/site-settings.js"
></script>



<!-- ==================================================
     PRODUCT JS
================================================== -->

<script
  type="module"
  src="js/product.js"
></script>



<!-- ==================================================
     SHARE JS
================================================== -->

<script
  src="js/share.js"
></script>



<!-- ==================================================
     BACK BUTTON
================================================== -->

<script>

  function goBack(){

    /*
      Always return to homepage.
    */

    location.href = "index";

  }

</script>


</body>

</html>
