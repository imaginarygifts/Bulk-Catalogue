<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<!-- SITE TITLE / DESCRIPTION
     These are updated automatically by site-settings.js
     from Firestore settings/general
-->

<title>Homepage</title>

<meta
    name="description"
    content=""
    id="siteMetaDescription"
>


<!-- ==================================================
     OPEN GRAPH
================================================== -->

<meta
    property="og:title"
    content=""
    id="ogTitle"
>

<meta
    property="og:description"
    content=""
    id="ogDescription"
>

<meta
    property="og:image"
    content=""
    id="ogImage"
>

<meta
    property="og:url"
    content=""
    id="ogUrl"
>

<meta
    property="og:type"
    content="website"
>


<!-- ==================================================
     HOMEPAGE CSS
================================================== -->

<link
    rel="stylesheet"
    href="css/homepage.css"
>


<!-- ==================================================
     FONT AWESOME
================================================== -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

</head>


<body>


<!-- ==================================================
     TOP BAR
================================================== -->

<header class="topbar">


    <!-- MENU BUTTON -->

    <button
        class="menu-btn"
        type="button"
        onclick="window.toggleSidebar()"
        aria-label="Open menu"
    >

        <i class="fa-solid fa-bars"></i>

    </button>


    <!-- ==================================================
         LOGO
    ================================================== -->

    <div class="logo">

        <a
            id="logoLink"
            data-logo-link
            href="index"
            aria-label="Home"
        >

            <img
                id="siteLogo"
                data-site-logo
                src=""
                alt="Company Logo"
            >

        </a>

    </div>


    <!-- ==================================================
         SEARCH BUTTON
    ================================================== -->

    <button
        class="search-icon"
        type="button"
        onclick="window.openSearch()"
        aria-label="Search"
    >

        🔍

    </button>


</header>



<!-- ==================================================
     SEARCH OVERLAY
================================================== -->

<div
    id="searchOverlay"
    class="search-overlay"
>


    <div class="search-box">


        <input
            type="text"
            id="searchInput"
            placeholder="Search for products..."
            autocomplete="off"
        >


        <button
            type="button"
            onclick="window.closeSearch()"
            aria-label="Close search"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


    </div>


</div>



<!-- ==================================================
     SIDEBAR
================================================== -->

<aside
    id="sidebar"
    class="sidebar"
>


    <!-- ==================================================
         SIDEBAR HEADER
    ================================================== -->

    <div class="sidebar-header">

        <strong data-company-name>

            Company Name

        </strong>


        <button
            type="button"
            onclick="window.toggleSidebar()"
            aria-label="Close menu"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>



    <!-- ==================================================
         HOME
    ================================================== -->

    <a
        href="index"
        data-home-link
    >

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>



    <!-- ==================================================
         CATEGORIES
    ================================================== -->

    <div class="sidebar-expandable">


        <button
            type="button"
            class="sidebar-expand-button"
            id="categoriesToggle"
        >

            <span>

                <i class="fa-solid fa-layer-group"></i>

                Categories

            </span>


            <i
                class="fa-solid fa-chevron-down sidebar-chevron"
            ></i>

        </button>


        <div
            id="sidebarCategories"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">

                Loading categories...

            </div>

        </div>


    </div>



    <!-- ==================================================
         TAGS
    ================================================== -->

    <div class="sidebar-expandable">


        <button
            type="button"
            class="sidebar-expand-button"
            id="tagsToggle"
        >

            <span>

                <i class="fa-solid fa-tags"></i>

                Tags

            </span>


            <i
                class="fa-solid fa-chevron-down sidebar-chevron"
            ></i>

        </button>


        <div
            id="sidebarTags"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">

                Loading tags...

            </div>

        </div>


    </div>



    <!-- ==================================================
         ABOUT
    ================================================== -->

    <a href="aboutus">

        <i class="fa-solid fa-circle-info"></i>

        <span>
            About Us
        </span>

    </a>



    <!-- ==================================================
         CONTACT
    ================================================== -->

    <a href="contact-us">

        <i class="fa-solid fa-phone"></i>

        <span>
            Contact Us
        </span>

    </a>



    <!-- ==================================================
         TERMS
    ================================================== -->

    <a href="t&c">

        <i class="fa-solid fa-file-contract"></i>

        <span>
            Terms & Conditions
        </span>

    </a>



    <!-- ==================================================
         PRIVACY
    ================================================== -->

    <a href="privacy-policy">

        <i class="fa-solid fa-lock"></i>

        <span>
            Privacy Policy
        </span>

    </a>



    <!-- ==================================================
         REFUND
    ================================================== -->

    <a href="refund">

        <i class="fa-solid fa-money-bill-transfer"></i>

        <span>
            Refund Policy
        </span>

    </a>



    <!-- ==================================================
         SHIPPING
    ================================================== -->

    <a href="shipping">

        <i class="fa-solid fa-truck"></i>

        <span>
            Shipping Policy
        </span>

    </a>


</aside>



<!-- ==================================================
     SIDEBAR OVERLAY
================================================== -->

<div
    id="overlay"
    class="overlay"
    onclick="window.toggleSidebar()"
></div>



<!-- ==================================================
     HOMEPAGE
================================================== -->

<main id="homepage">

    <!--
        Homepage sections are loaded
        dynamically from Firestore.
    -->

</main>



<!-- ==================================================
     WRITE REVIEW BUTTON
================================================== -->

<button
    type="button"
    class="write-review-btn"
    onclick="window.openReviewPopup()"
>

    ⭐ Write a Review

</button>



<!-- ==================================================
     CUSTOMER REVIEW POPUP
================================================== -->

<div
    id="reviewPopup"
    class="review-popup hidden"
>


    <div class="review-popup-box">


        <!-- ==================================================
             POPUP HEADER
        ================================================== -->

        <div class="review-popup-header">


            <h2>

                Write a Review

            </h2>


            <button
                type="button"
                onclick="window.closeReviewPopup()"
                class="review-close-btn"
                aria-label="Close"
            >

                ×

            </button>


        </div>



        <!-- ==================================================
             REVIEW FORM
        ================================================== -->

        <form
            id="customerReviewForm"
            class="customer-review-form"
        >


            <!-- ==================================================
                 CUSTOMER NAME
            ================================================== -->

            <label
                for="reviewCustomerName"
            >

                Your Name

            </label>


            <input
                type="text"
                id="reviewCustomerName"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >



            <!-- ==================================================
                 CUSTOMER IMAGE
            ================================================== -->

            <label
                for="reviewCustomerImage"
            >

                Customer Image

            </label>


            <input
                type="file"
                id="reviewCustomerImage"
                accept="image/*"
            >


            <div
                id="customerImagePreview"
                class="customer-image-preview hidden"
            ></div>



            <!-- ==================================================
                 PRODUCT SEARCH
            ================================================== -->

            <label
                for="reviewProductSearch"
            >

                Select Product

            </label>


            <div class="review-product-search">


                <input
                    type="text"
                    id="reviewProductSearch"
                    placeholder="Search product..."
                    autocomplete="off"
                >


                <div
                    id="reviewProductResults"
                    class="review-product-results hidden"
                ></div>


            </div>



            <!-- ==================================================
                 SELECTED PRODUCT
            ================================================== -->

            <div
                id="selectedReviewProduct"
                class="selected-review-product hidden"
            >


                <img
                    id="selectedProductImage"
                    src=""
                    alt="Selected Product"
                >


                <div>


                    <strong
                        id="selectedProductName"
                    ></strong>


                    <button
                        type="button"
                        onclick="window.clearSelectedReviewProduct()"
                    >

                        Change

                    </button>


                </div>


            </div>



            <!-- ==================================================
                 RATING
            ================================================== -->

            <label>

                Rating

            </label>


            <div
                id="reviewRating"
                class="review-rating"
                role="radiogroup"
                aria-label="Product rating"
            >


                <button
                    type="button"
                    data-rating="1"
                    aria-label="1 star"
                >

                    ★

                </button>


                <button
                    type="button"
                    data-rating="2"
                    aria-label="2 stars"
                >

                    ★

                </button>


                <button
                    type="button"
                    data-rating="3"
                    aria-label="3 stars"
                >

                    ★

                </button>


                <button
                    type="button"
                    data-rating="4"
                    aria-label="4 stars"
                >

                    ★

                </button>


                <button
                    type="button"
                    data-rating="5"
                    aria-label="5 stars"
                >

                    ★

                </button>


            </div>



            <!-- ==================================================
                 REVIEW
            ================================================== -->

            <label
                for="reviewText"
            >

                Review

            </label>


            <textarea
                id="reviewText"
                placeholder="Write your experience..."
                rows="5"
                required
            ></textarea>



            <!-- ==================================================
                 ERROR
            ================================================== -->

            <div
                id="reviewFormError"
                class="review-form-error hidden"
            ></div>



            <!-- ==================================================
                 SUBMIT
            ================================================== -->

            <button
                type="submit"
                id="submitReviewBtn"
                class="submit-review-btn"
            >

                Submit Review

            </button>


        </form>


    </div>


</div>



<!-- ==================================================
     HOMEPAGE JAVASCRIPT
================================================== -->


<!-- SITE SETTINGS -->

<script
    type="module"
    src="js/site-settings.js"
></script>


<!-- HOMEPAGE -->

<script
    type="module"
    src="js/homepage.js"
></script>


<!-- SIDEBAR -->

<script
    type="module"
    src="/js/sidebar.js"
></script>


<!-- CUSTOMER REVIEW -->

<script
    type="module"
    src="js/customer-review.js"
></script>


</body>

</html>
