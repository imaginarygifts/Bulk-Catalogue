<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Homepage</title>


<!-- HOMEPAGE CSS -->

<link
    rel="stylesheet"
    href="css/homepage.css"
>


<!-- FONT AWESOME -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

</head>


<body>


<!-- ==================================================
     TOP BAR
================================================== -->

<header class="topbar">


    <!-- MENU BUTTON -->

    <button
        class="menu-btn"
        type="button"
        onclick="toggleSidebar()"
        aria-label="Open menu"
    >

        <i class="fa-solid fa-bars"></i>

    </button>



    <!-- LOGO -->

      <div class="logo">

    <a
      id="logoLink"
      data-logo-link
      href="index"
      aria-label="Home"
    >

      <img
        id="siteLogo"
        data-site-logo
        src=""
        alt="Company Logo"
      >

    </a>

  </div>



    <!-- SEARCH BUTTON -->


    <button
        class="search-icon"
        type="button"
        onclick="openSearch()"
        aria-label="Search"
    >

        🔍

    </button>


</header>



<!-- ==================================================
     SEARCH OVERLAY
================================================== -->

<div
    id="searchOverlay"
    class="search-overlay"
>


    <div class="search-box">


        <input
            type="text"
            id="searchInput"
            placeholder="Search for products..."
            autocomplete="off"
        >


        <button
            type="button"
            onclick="closeSearch()"
            aria-label="Close search"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


    </div>


</div>



<!-- ==================================================
     SIDEBAR
================================================== -->

<aside
    id="sidebar"
    class="sidebar"
>

    <!-- SIDEBAR HEADER -->


<div class="sidebar-header">

    <strong data-company-name>
        Company Name
    </strong>

    <button
        type="button"
        onclick="toggleSidebar()"
        aria-label="Close menu"
    >
        <i class="fa-solid fa-xmark"></i>
    </button>

</div>

    <!-- ==================================================
         HOME
    ================================================== -->

    <a href="">

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>


    <!-- ==================================================
         CATEGORIES
    ================================================== -->

    <div class="sidebar-expandable">

        <button
            type="button"
            class="sidebar-expand-button"
            id="categoriesToggle"
        >

            <span>

                <i class="fa-solid fa-layer-group"></i>

                Categories

            </span>

            <i
                class="fa-solid fa-chevron-down sidebar-chevron"
            ></i>

        </button>


        <div
            id="sidebarCategories"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">
                Loading categories...
            </div>

        </div>

    </div>


    <!-- ==================================================
         TAGS
    ================================================== -->

    <div class="sidebar-expandable">

        <button
            type="button"
            class="sidebar-expand-button"
            id="tagsToggle"
        >

            <span>

                <i class="fa-solid fa-tags"></i>

                Tags

            </span>

            <i
                class="fa-solid fa-chevron-down sidebar-chevron"
            ></i>

        </button>


        <div
            id="sidebarTags"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">
                Loading tags...
            </div>

        </div>

    </div>


    <!-- ==================================================
         ABOUT
    ================================================== -->

    <a href="aboutus">

        <i class="fa-solid fa-circle-info"></i>

        <span>
            About Us
        </span>

    </a>


    <!-- ==================================================
         CONTACT
    ================================================== -->

    <a href="contact-us">

        <i class="fa-solid fa-phone"></i>

        <span>
            Contact Us
        </span>

    </a>


    <!-- ==================================================
         TERMS
    ================================================== -->

    <a href="t&c">

        <i class="fa-solid fa-file-contract"></i>

        <span>
            Terms & Conditions
        </span>

    </a>


    <!-- ==================================================
         PRIVACY
    ================================================== -->

    <a href="privacy-policy">

        <i class="fa-solid fa-lock"></i>

        <span>
            Privacy Policy
        </span>

    </a>


    <!-- ==================================================
         REFUND
    ================================================== -->

    <a href="refund">

        <i class="fa-solid fa-money-bill-transfer"></i>

        <span>
            Refund Policy
        </span>

    </a>


    <!-- ==================================================
         SHIPPING
    ================================================== -->

    <a href="shipping">

        <i class="fa-solid fa-truck"></i>

        <span>
            Shipping Policy
        </span>

    </a>


</aside>


<!-- ==================================================
     SIDEBAR OVERLAY
================================================== -->

<div
    id="overlay"
    class="overlay"
    onclick="toggleSidebar()"
></div>


<!-- ==================================================
     HOMEPAGE
================================================== -->

<main id="homepage">

    <!-- Sections will be loaded from Firestore -->

</main>

<button
    type="button"
    class="write-review-btn"
    onclick="openReviewPopup()"
>
    ⭐ Write a Review
</button>


<!-- ==================================================
     CUSTOMER REVIEW POPUP
================================================== -->

<div
    id="reviewPopup"
    class="review-popup hidden"
>

    <div class="review-popup-box">

        <!-- HEADER -->

        <div class="review-popup-header">

            <h2>
                Write a Review
            </h2>

            <button
                type="button"
                onclick="closeReviewPopup()"
                class="review-close-btn"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <!-- FORM -->

        <form
            id="customerReviewForm"
            class="customer-review-form"
        >

            <!-- NAME -->

            <label>
                Your Name
            </label>

            <input
                type="text"
                id="reviewCustomerName"
                placeholder="Enter your name"
                required
            >


            <!-- CUSTOMER IMAGE -->

            <label>
                Customer Image
            </label>

            <input
                type="file"
                id="reviewCustomerImage"
                accept="image/*"
            >

            <div
                id="customerImagePreview"
                class="customer-image-preview hidden"
            ></div>


            <!-- PRODUCT SEARCH -->

            <label>
                Select Product
            </label>

            <div class="review-product-search">

                <input
                    type="text"
                    id="reviewProductSearch"
                    placeholder="Search product..."
                    autocomplete="off"
                >

                <div
                    id="reviewProductResults"
                    class="review-product-results hidden"
                ></div>

            </div>


            <!-- SELECTED PRODUCT -->

            <div
                id="selectedReviewProduct"
                class="selected-review-product hidden"
            >

                <img
                    id="selectedProductImage"
                    src=""
                    alt="Product"
                >

                <div>

                    <strong
                        id="selectedProductName"
                    ></strong>

                    <button
                        type="button"
                        onclick="clearSelectedReviewProduct()"
                    >
                        Change
                    </button>

                </div>

            </div>


            <!-- RATING -->

            <label>
                Rating
            </label>

            <div
                id="reviewRating"
                class="review-rating"
            >

                <button
                    type="button"
                    data-rating="1"
                >
                    ★
                </button>

                <button
                    type="button"
                    data-rating="2"
                >
                    ★
                </button>

                <button
                    type="button"
                    data-rating="3"
                >
                    ★
                </button>

                <button
                    type="button"
                    data-rating="4"
                >
                    ★
                </button>

                <button
                    type="button"
                    data-rating="5"
                >
                    ★
                </button>

            </div>


            <!-- REVIEW -->

            <label>
                Review
            </label>

            <textarea
                id="reviewText"
                placeholder="Write your experience..."
                rows="5"
                required
            ></textarea>


            <!-- ERROR -->

            <div
                id="reviewFormError"
                class="review-form-error hidden"
            ></div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="submitReviewBtn"
                class="submit-review-btn"
            >
                Submit Review
            </button>

        </form>

    </div>

</div>

<!-- ==================================================
     HOMEPAGE JAVASCRIPT
================================================== -->

<script
  type="module"
  src="js/site-settings.js"
></script>

<script
    type="module"
    src="js/homepage.js"
></script>

<script
    type="module"
    src="/js/sidebar.js"
></script>

<script
    type="module"
    src="js/customer-review.js"
></script>

</body>

</html>
