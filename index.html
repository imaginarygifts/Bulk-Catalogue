<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Imaginary Gifts - Customized Gifts Catalogue
    </title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Buy customized gifts online - frames, mugs, wallets & more"
    >


    <!-- ==========================================
         OPEN GRAPH
    =========================================== -->

    <meta
        property="og:title"
        content="Imaginary Gifts - Customized Gifts"
    >

    <meta
        property="og:description"
        content="Create beautiful personalized gifts for every occasion"
    >

    <meta
        property="og:image"
        content="https://imaginarygifts.shopcom.in/images/preview.jpg?v=2"
    >

    <meta
        property="og:url"
        content="https://imaginarygifts.shopcom.in"
    >

    <meta
        property="og:type"
        content="website"
    >


    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==========================================
         STORE CSS
         ONLY STORE PAGE
    =========================================== -->

    <link
        rel="stylesheet"
        href="css/shop.css"
    >


    <!-- ==========================================
         TOPBAR CSS
         TOPBAR + SIDEBAR + SEARCH
    =========================================== -->

    <link
        rel="stylesheet"
        href="css/topbar.css"
    >

</head>


<body>


<!-- ==================================================
     COMMON TOPBAR

     Controlled by:
     topbar.js
     topbar.css
================================================== -->

<header class="topbar">


    <!-- ==========================================
         MENU
    =========================================== -->

    <button
        class="menu-btn"
        id="menuButton"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
    >

        <i class="fa-solid fa-bars"></i>

    </button>



    <!-- ==========================================
         LOGO
    =========================================== -->

    <div class="logo">

        <a
            id="logoLink"
            data-logo-link
            href="index"
            aria-label="Home"
        >

            <img
                id="siteLogo"
                data-site-logo
                src=""
                alt="Company Logo"
            >

        </a>

    </div>



    <!-- ==========================================
         SEARCH BUTTON
    =========================================== -->

    <button
        class="search-icon"
        id="searchButton"
        type="button"
        aria-label="Search"
    >

        <i class="fa-solid fa-magnifying-glass"></i>

    </button>

</header>



<!-- ==================================================
     SEARCH OVERLAY

     Controlled by:
     topbar.js
     topbar.css

     DO NOT add search logic to store.js
================================================== -->

<div
    id="searchOverlay"
    class="search-overlay"
    aria-hidden="true"
>


    <div class="search-panel">


        <!-- ======================================
             SEARCH HEADER
        ======================================= -->

        <div class="search-header">


            <div class="search-title">

                Search Products

            </div>


            <button
                type="button"
                class="search-close"
                id="closeSearchButton"
                aria-label="Close search"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>



        <!-- ======================================
             SEARCH INPUT
        ======================================= -->

        <div class="search-input-wrap">


            <span class="search-input-icon">

                <i
                    class="fa-solid fa-magnifying-glass"
                ></i>

            </span>


            <input
                type="search"
                id="searchInput"
                class="search-input"
                placeholder="Search products..."
                autocomplete="off"
            >


            <button
                type="button"
                id="clearSearchButton"
                class="clear-search-button"
                aria-label="Clear search"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>



        <!-- ======================================
             SEARCH RESULTS
        ======================================= -->

        <div
            id="searchResults"
            class="search-results"
        >

            <div class="search-empty">

                Type to search products

            </div>

        </div>


    </div>

</div>



<!-- ==================================================
     COMMON SIDEBAR

     Controlled by:
     topbar.js
     topbar.css
================================================== -->

<aside
    id="sidebar"
    class="sidebar"
    aria-hidden="true"
>


    <!-- ==========================================
         SIDEBAR HEADER
    =========================================== -->

    <div class="sidebar-header">


        <strong data-company-name>

            Company Name

        </strong>


        <button
            type="button"
            id="closeSidebarButton"
            aria-label="Close menu"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


    </div>



    <!-- ==========================================
         HOME
    =========================================== -->

    <a
        href="index"
        data-home-link
    >

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>



    <!-- ==========================================
         CATEGORIES
    =========================================== -->

    <div class="sidebar-expandable">


        <button
            type="button"
            class="sidebar-expand-button"
            id="categoriesToggle"
        >

            <span>

                <i class="fa-solid fa-layer-group"></i>

                Categories

            </span>


            <i
                class="fa-solid fa-chevron-down sidebar-chevron"
            ></i>

        </button>


        <div
            id="sidebarCategories"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">

                Loading categories...

            </div>

        </div>


    </div>



    <!-- ==========================================
         TAGS
    =========================================== -->

    <div class="sidebar-expandable">


        <button
            type="button"
            class="sidebar-expand-button"
            id="tagsToggle"
        >

            <span>

                <i class="fa-solid fa-tags"></i>

                Tags

            </span>


            <i
                class="fa-solid fa-chevron-down sidebar-chevron"
            ></i>

        </button>


        <div
            id="sidebarTags"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">

                Loading tags...

            </div>

        </div>


    </div>



    <!-- ==========================================
         ABOUT
    =========================================== -->

    <a href="aboutus">

        <i class="fa-solid fa-circle-info"></i>

        <span>
            About Us
        </span>

    </a>



    <!-- ==========================================
         CONTACT
    =========================================== -->

    <a href="contact-us">

        <i class="fa-solid fa-phone"></i>

        <span>
            Contact Us
        </span>

    </a>



    <!-- ==========================================
         TERMS
    =========================================== -->

    <a href="t&c">

        <i class="fa-solid fa-file-contract"></i>

        <span>
            Terms & Conditions
        </span>

    </a>



    <!-- ==========================================
         PRIVACY
    =========================================== -->

    <a href="privacy-policy">

        <i class="fa-solid fa-lock"></i>

        <span>
            Privacy Policy
        </span>

    </a>



    <!-- ==========================================
         REFUND
    =========================================== -->

    <a href="refund">

        <i class="fa-solid fa-money-bill-transfer"></i>

        <span>
            Refund Policy
        </span>

    </a>



    <!-- ==========================================
         SHIPPING
    =========================================== -->

    <a href="shipping">

        <i class="fa-solid fa-truck"></i>

        <span>
            Shipping Policy
        </span>

    </a>


</aside>



<!-- ==================================================
     SIDEBAR OVERLAY
================================================== -->

<div
    id="overlay"
    class="overlay"
></div>



<!-- ==================================================
     STORE PAGE
     
     EVERYTHING BELOW HERE IS STORE CONTENT.
     
     Controlled by:
     store.js
     store.css
================================================== -->


<!-- ==========================================
     MAIN CATEGORY BAR
=========================================== -->

<div
    id="categoryBar"
    class="category-scroll"
></div>



<!-- ==========================================
     SUBCATEGORY BAR
=========================================== -->

<div
    id="subCategoryBar"
    class="subcategory-row"
></div>



<!-- ==========================================
     TAG FILTER
=========================================== -->

<div
    id="tagFilterRow"
    class="tag-filter-row"
></div>



<!-- ==========================================
     PRODUCTS
=========================================== -->

<main
    class="store-main"
>

    <div
        id="productGrid"
        class="product-grid"
    ></div>

</main>



<!-- ==================================================
     SHARE BUTTON
================================================== -->

<div
    id="shareBtn"
    class="share-button"
    onclick="sharePage()"
    aria-label="Share this page"
>

    <i class="fa-solid fa-share-nodes"></i>

</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->


<!-- SITE SETTINGS -->

<script
    type="module"
    src="js/site-settings.js"
></script>



<!-- TOPBAR

     Handles:
     - menu
     - sidebar
     - logo
     - search
     - sidebar categories
     - sidebar tags
-->

<script
    type="module"
    src="js/topbar.js"
></script>



<!-- STORE

     Handles:
     - products
     - categories
     - subcategories
     - tags
     - filtering
     - load more
-->

<script
    type="module"
    src="js/store.js"
></script>



<!-- SHARE -->

<script
    src="js/share.js"
></script>


</body>

</html>
