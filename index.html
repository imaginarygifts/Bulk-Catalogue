<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- ==================================================
         DEFAULT SEO
    ================================================== -->

    <title>Homepage</title>

    <meta
        id="siteMetaDescription"
        name="description"
        content=""
    >


    <!-- ==================================================
         OPEN GRAPH
    ================================================== -->

    <meta
        id="ogTitle"
        property="og:title"
        content=""
    >

    <meta
        id="ogDescription"
        property="og:description"
        content=""
    >

    <meta
        id="ogImage"
        property="og:image"
        content=""
    >

    <meta
        id="ogUrl"
        property="og:url"
        content=""
    >

    <meta
        property="og:type"
        content="website"
    >


    <!-- ==================================================
         HOMEPAGE CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/homepage.css"
    >


    <!-- ==================================================
         SIDEBAR / TOPBAR CSS
         Keep this if sidebar.css exists.
         If all styling is already inside homepage.css,
         this line can be removed.
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/topbar.css"
    >


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>

<!-- =========================================
     HOMEPAGE RUNNING NOTE
========================================= -->

<div
    id="homepageNoteBar"
    class="homepage-note-bar"
    style="display: none;"
>

    <div
        id="homepageNoteTrack"
        class="homepage-note-track"
    ></div>

</div>

<!-- ==================================================
     TOPBAR
================================================== -->

<header class="site-topbar">

    <!-- MENU BUTTON -->

    <button
        type="button"
        class="topbar-button menu-button"
        id="menuButton"
        aria-label="Open menu"
        aria-expanded="false"
    >
        <i class="fa-solid fa-bars"></i>
    </button>


    <!-- LOGO -->

    <div class="topbar-logo">

        <a
            href=""
            id="logoLink"
            data-logo-link
            aria-label="Home"
        >

            <img
                id="siteLogo"
                data-site-logo
                src=""
                alt="Company Logo"
            >

        </a>

    </div>


    <!-- SEARCH BUTTON -->

    <button
        type="button"
        class="topbar-button search-button"
        id="searchButton"
        aria-label="Search"
    >
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>

</header>



<!-- ==================================================
     SEARCH OVERLAY
     HIDDEN UNTIL SEARCH BUTTON IS CLICKED
================================================== -->

<div
    id="searchOverlay"
    class="search-overlay"
    aria-hidden="true"
>

    <div class="search-panel">

        <!-- SEARCH HEADER -->

        <div class="search-header">

            <div class="search-title">
                Search Products
            </div>

            <button
                type="button"
                class="search-close-button"
                id="closeSearchButton"
                aria-label="Close search"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <!-- SEARCH INPUT -->

        <div class="search-input-wrapper">

            <i class="fa-solid fa-magnifying-glass search-input-icon"></i>

            <input
                type="search"
                id="searchInput"
                class="search-input"
                placeholder="Search for products..."
                autocomplete="off"
            >

            <button
                type="button"
                id="clearSearchButton"
                class="clear-search-button"
                aria-label="Clear search"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <!-- SEARCH RESULTS -->

        <div
            id="searchResults"
            class="search-results"
        >

            <div class="search-message">
                Search for a product
            </div>

        </div>

    </div>

</div>



<!-- ==================================================
     SIDEBAR OVERLAY
================================================== -->

<div
    id="sidebarOverlay"
    class="sidebar-overlay"
    aria-hidden="true"
></div>



<!-- ==================================================
     SIDEBAR
================================================== -->

<aside
    id="sidebar"
    class="site-sidebar"
    aria-hidden="true"
>

    <!-- SIDEBAR HEADER -->

    <div class="sidebar-header">

        <strong data-company-name>
            Company Name
        </strong>

        <button
            type="button"
            class="sidebar-close-button"
            id="closeSidebarButton"
            aria-label="Close menu"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>


    <!-- HOME -->

    <a
        href=""
        class="sidebar-link"
        data-home-link
    >

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </a>

     <!-- Shop -->

    <a
        href="shop"
        class="sidebar-link"
        
    >

        <i class="fa-solid fa-house"></i>

        <span>
           Shop
        </span>

    </a>


    <!-- CATEGORIES -->

    <div class="sidebar-expandable">

        <button
            type="button"
            class="sidebar-expand-button"
            id="categoriesToggle"
            aria-expanded="false"
        >

            <span>

                <i class="fa-solid fa-layer-group"></i>

                Categories

            </span>

            <i class="fa-solid fa-chevron-down sidebar-chevron"></i>

        </button>


        <div
            id="sidebarCategories"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">
                Loading categories...
            </div>

        </div>

    </div>


    <!-- TAGS -->

    <div class="sidebar-expandable">

        <button
            type="button"
            class="sidebar-expand-button"
            id="tagsToggle"
            aria-expanded="false"
        >

            <span>

                <i class="fa-solid fa-tags"></i>

                Tags

            </span>

            <i class="fa-solid fa-chevron-down sidebar-chevron"></i>

        </button>


        <div
            id="sidebarTags"
            class="sidebar-submenu"
        >

            <div class="sidebar-loading">
                Loading tags...
            </div>

        </div>

    </div>


    <!-- ABOUT -->

    <a
        href="aboutus"
        class="sidebar-link"
    >

        <i class="fa-solid fa-circle-info"></i>

        <span>
            About Us
        </span>

    </a>


    <!-- CONTACT -->

    <a
        href="contact-us"
        class="sidebar-link"
    >

        <i class="fa-solid fa-phone"></i>

        <span>
            Contact Us
        </span>

    </a>


    <!-- TERMS -->

    <a
        href="t&c"
        class="sidebar-link"
    >

        <i class="fa-solid fa-file-contract"></i>

        <span>
            Terms & Conditions
        </span>

    </a>


    <!-- PRIVACY -->

    <a
        href="privacy-policy"
        class="sidebar-link"
    >

        <i class="fa-solid fa-lock"></i>

        <span>
            Privacy Policy
        </span>

    </a>


    <!-- REFUND -->

    <a
        href="refund"
        class="sidebar-link"
    >

        <i class="fa-solid fa-money-bill-transfer"></i>

        <span>
            Refund Policy
        </span>

    </a>


    <!-- SHIPPING -->

    <a
        href="shipping"
        class="sidebar-link"
    >

        <i class="fa-solid fa-truck"></i>

        <span>
            Shipping Policy
        </span>

    </a>

</aside>


    <!-- ==================================================
         HOMEPAGE
         
         Firestore homepage sections are rendered here
         by homepage.js.
    ================================================== -->

    <main id="homepage">

        <!-- Firestore homepage sections load here -->

    </main>



    <!-- ==================================================
         HOMEPAGE LOADER
         
         IMPORTANT:
         homepage.js looks for #homepageLoader.
    ================================================== -->

    <div
        id="homepageLoader"
        class="homepage-loader"
    >

        <div class="homepage-loader-spinner"></div>

    </div>



    <!-- ==================================================
         WRITE REVIEW BUTTON
    ================================================== -->

    <button
        type="button"
        id="openReviewButton"
        class="write-review-btn"
    >

        ⭐ Write a Review

    </button>



    <!-- ==================================================
         CUSTOMER REVIEW POPUP
    ================================================== -->

    <div
        id="reviewPopup"
        class="review-popup hidden"
        aria-hidden="true"
    >

        <div
            class="review-popup-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="reviewPopupTitle"
        >


            <!-- HEADER -->

            <div class="review-popup-header">

                <h2 id="reviewPopupTitle">

                    Write a Review

                </h2>


                <button
                    type="button"
                    id="closeReviewButton"
                    class="review-close-btn"
                    aria-label="Close review form"
                >

                    ×

                </button>

            </div>



            <!-- FORM -->

            <form
                id="customerReviewForm"
                class="customer-review-form"
            >


                <!-- NAME -->

                <label
                    for="reviewCustomerName"
                >

                    Your Name

                </label>


                <input
                    type="text"
                    id="reviewCustomerName"
                    placeholder="Enter your name"
                    autocomplete="name"
                    maxlength="100"
                    required
                >



                <!-- CUSTOMER IMAGE -->

                <label
                    for="reviewCustomerImage"
                >

                    Customer Image

                    <span class="optional-label">

                        Optional

                    </span>

                </label>


                <input
                    type="file"
                    id="reviewCustomerImage"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                >


                <div
                    id="customerImagePreview"
                    class="customer-image-preview hidden"
                >

                    <img
                        id="customerImagePreviewImg"
                        src=""
                        alt="Customer preview"
                    >


                    <button
                        type="button"
                        id="removeCustomerImageButton"
                    >

                        Remove

                    </button>

                </div>



                <!-- PRODUCT SEARCH -->

                <label
                    for="reviewProductSearch"
                >

                    Select Product

                </label>


                <div class="review-product-search">

                    <input
                        type="text"
                        id="reviewProductSearch"
                        placeholder="Search product..."
                        autocomplete="off"
                    >


                    <div
                        id="reviewProductResults"
                        class="review-product-results hidden"
                    ></div>

                </div>



                <!-- SELECTED PRODUCT -->

                <div
                    id="selectedReviewProduct"
                    class="selected-review-product hidden"
                >

                    <img
                        id="selectedProductImage"
                        src=""
                        alt="Selected Product"
                    >


                    <div class="selected-review-product-info">

                        <strong
                            id="selectedProductName"
                        ></strong>


                        <button
                            type="button"
                            id="changeReviewProductButton"
                        >

                            Change

                        </button>

                    </div>

                </div>



                <!-- RATING -->

                <label>

                    Rating

                </label>


                <div
                    id="reviewRating"
                    class="review-rating"
                    role="radiogroup"
                    aria-label="Rating"
                >

                    <button
                        type="button"
                        data-rating="1"
                        aria-label="1 star"
                    >
                        ★
                    </button>

                    <button
                        type="button"
                        data-rating="2"
                        aria-label="2 stars"
                    >
                        ★
                    </button>

                    <button
                        type="button"
                        data-rating="3"
                        aria-label="3 stars"
                    >
                        ★
                    </button>

                    <button
                        type="button"
                        data-rating="4"
                        aria-label="4 stars"
                    >
                        ★
                    </button>

                    <button
                        type="button"
                        data-rating="5"
                        aria-label="5 stars"
                    >
                        ★
                    </button>

                </div>



                <!-- REVIEW -->

                <label
                    for="reviewText"
                >

                    Review

                </label>


                <textarea
                    id="reviewText"
                    placeholder="Write your experience..."
                    rows="5"
                    maxlength="1000"
                    required
                ></textarea>



                <!-- ==================================================
                     CUSTOMER PRODUCT IMAGE
                ================================================== -->

                <label
                    for="reviewProductImage"
                >

                    Product Image

                    <span class="optional-label">

                        Optional

                    </span>

                </label>


                <input
                    type="file"
                    id="reviewProductImage"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                >


                <div
                    id="productImagePreview"
                    class="customer-image-preview hidden"
                >

                    <img
                        id="productImagePreviewImg"
                        src=""
                        alt="Product image preview"
                    >


                    <button
                        type="button"
                        id="removeProductImageButton"
                    >

                        Remove

                    </button>

                </div>



                <!-- ERROR -->

                <div
                    id="reviewFormError"
                    class="review-form-error hidden"
                ></div>



                <!-- SUCCESS -->

                <div
                    id="reviewFormSuccess"
                    class="review-form-success hidden"
                ></div>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="submitReviewBtn"
                    class="submit-review-btn"
                >

                    Submit Review

                </button>


            </form>

        </div>

    </div>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->


    <!-- SITE SETTINGS -->

    <script
        type="module"
        src="js/site-settings.js"
    ></script>



    <!-- HOMEPAGE -->

    <script
        type="module"
        src="js/homepage.js"
    ></script>



    <!-- SIDEBAR -->

    <script
        type="module"
        src="js/topbar.js"
    ></script>



    <!-- CUSTOMER REVIEW FORM -->

    <script
        type="module"
        src="js/customer-review.js"
    ></script>


</body>

</html>
