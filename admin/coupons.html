<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- IMPORTANT: MOBILE VIEWPORT -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Coupons</title>

    <link
        rel="stylesheet"
        href="../css/coupons.css"
    >

</head>


<body>

    <main class="coupon-page">

        <!-- =========================================
             PAGE TITLE
        ========================================== -->

        <h2 class="page-title">
            Coupons
        </h2>


        <!-- =========================================
             CREATE COUPON
        ========================================== -->

        <section class="card coupon-form">

            <input
                id="code"
                type="text"
                placeholder="Coupon Code"
                autocomplete="off"
            >


            <select id="type">

                <option value="percent">
                    Percent
                </option>

                <option value="flat">
                    Flat
                </option>

            </select>


            <input
                id="value"
                type="number"
                inputmode="decimal"
                placeholder="Discount value"
            >


            <input
                id="minOrder"
                type="number"
                inputmode="decimal"
                placeholder="Minimum order"
            >


            <input
                id="expiry"
                type="date"
            >


            <select id="scope">

                <option value="global">
                    Global
                </option>

                <option value="product">
                    Product specific
                </option>

            </select>


            <!-- =====================================
                 PAYMENT MODES
            ====================================== -->

            <div class="payment-modes">

                <label class="check-row">

                    <input
                        type="checkbox"
                        value="online"
                        class="payMode"
                    >

                    <span>
                        Online
                    </span>

                </label>


                <label class="check-row">

                    <input
                        type="checkbox"
                        value="cod"
                        class="payMode"
                    >

                    <span>
                        COD
                    </span>

                </label>


                <label class="check-row">

                    <input
                        type="checkbox"
                        value="advance"
                        class="payMode"
                    >

                    <span>
                        Advance
                    </span>

                </label>

            </div>


            <select id="stackRule">

                <option value="stack">
                    Stack
                </option>

                <option value="replace">
                    Replace
                </option>

                <option value="best">
                    Best
                </option>

            </select>


            <!-- =====================================
                 SAVE
            ====================================== -->

            <button
                type="button"
                id="saveCoupon"
                onclick="saveCoupon()"
            >
                Save Coupon
            </button>

        </section>


        <!-- =========================================
             ALL COUPONS
        ========================================== -->

        <h3 class="section-title">
            All Coupons
        </h3>


        <section
            id="couponList"
            class="coupon-list"
        >
        </section>

    </main>


    <script
        type="module"
        src="../js/coupons.js"
    ></script>

</body>

</html>
