<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Coupons</title>

    <link
        rel="stylesheet"
        href="../css/coupons.css"
    >

</head>


<body>

    <main class="coupon-page">

        <!-- =========================================
             PAGE TITLE
        ========================================== -->

        <h2 class="page-title">
            Coupons
        </h2>


        <!-- =========================================
             CREATE COUPON
        ========================================== -->

        <section class="card coupon-form">

            <!-- Coupon Code -->

            <input
                id="code"
                type="text"
                placeholder="Coupon Code"
                autocomplete="off"
            >


            <!-- Coupon Type -->

            <select id="type">

                <option value="percent">
                    Percent
                </option>

                <option value="flat">
                    Flat
                </option>

                <option value="free_shipping">
                    Free Shipping
                </option>

            </select>


            <!-- Discount Value -->

            <div id="discountValueBox">

                <input
                    id="value"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    placeholder="Discount value"
                >

            </div>


            <!-- Minimum Order -->

            <input
                id="minOrder"
                type="number"
                inputmode="decimal"
                min="0"
                placeholder="Minimum order"
            >


            <!-- Coupon Expiry -->

            <input
                id="expiry"
                type="date"
                placeholder="Coupon Expiry"
                aria-label="Coupon Expiry"
            >


            <!-- =====================================
                 FREE SHIPPING OPTION
            ====================================== -->

            <div
                id="freeShippingBox"
                class="free-shipping-option"
            >

                <label class="check-row">

                    <input
                        type="checkbox"
                        id="freeShipping"
                    >

                    <span>
                        Free Shipping
                    </span>

                </label>

            </div>


            <!-- =====================================
                 SCOPE
            ====================================== -->

            <select id="scope">

                <option value="global">
                    Global
                </option>

                <option value="product">
                    Product specific
                </option>

            </select>


            <!-- =====================================
                 PRODUCT SELECTION
            ====================================== -->

            <div
                id="productSelector"
                class="product-selector"
                style="display:none;"
            >

                <div class="product-selector-title">
                    Select Products
                </div>


                <input
                    type="search"
                    id="productSearch"
                    placeholder="Search product..."
                    autocomplete="off"
                >


                <div class="product-actions">

                    <button
                        type="button"
                        id="selectAllProducts"
                    >
                        Select All
                    </button>


                    <button
                        type="button"
                        id="clearProducts"
                    >
                        Clear
                    </button>

                </div>


                <div
                    id="selectedProductCount"
                    class="selected-product-count"
                >
                    0 products selected
                </div>


                <div
                    id="productList"
                    class="product-list"
                >
                    Loading products...
                </div>

            </div>


            <!-- =====================================
                 PAYMENT MODES
            ====================================== -->

            <div class="payment-modes">

                <label class="check-row">

                    <input
                        type="checkbox"
                        value="online"
                        class="payMode"
                    >

                    <span>
                        Online
                    </span>

                </label>


                <label class="check-row">

                    <input
                        type="checkbox"
                        value="cod"
                        class="payMode"
                    >

                    <span>
                        COD
                    </span>

                </label>


                <label class="check-row">

                    <input
                        type="checkbox"
                        value="advance"
                        class="payMode"
                    >

                    <span>
                        Advance
                    </span>

                </label>

            </div>


            <!-- =====================================
                 STACK RULE
            ====================================== -->

            <select id="stackRule">

                <option value="stack">
                    Stack
                </option>

                <option value="replace">
                    Replace
                </option>

                <option value="best">
                    Best
                </option>

            </select>


            <!-- =====================================
                 SAVE
            ====================================== -->

            <button
                type="button"
                id="saveCoupon"
                onclick="saveCoupon()"
            >
                Save Coupon
            </button>

        </section>


        <!-- =========================================
             ALL COUPONS
        ========================================== -->

        <h3 class="section-title">
            All Coupons
        </h3>


        <section
            id="couponList"
            class="coupon-list"
        >
        </section>

    </main>


    <script
        type="module"
        src="../js/coupons.js"
    ></script>

</body>

</html>
