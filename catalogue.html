<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue</title>
<meta name="description" content="Browse our product catalogue.">
<link rel="stylesheet" href="css/catalogue.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<header class="catalogue-header">
  <a href="home.html" class="catalogue-logo"><span class="logo-mark"><i class="fa-solid fa-gift"></i></span><span>Imaginary Gifts</span></a>
  <a href="shop" class="back-shop"><i class="fa-solid fa-arrow-left"></i> Shop</a>
</header>
<main id="catalogueContainer" class="catalogue-container"><div id="catalogueLoading" class="catalogue-loading"><div class="spinner"></div><p>Loading catalogue...</p></div></main>
<div id="catalogueLightbox" class="catalogue-lightbox">
  <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
  <button id="lightboxPrev" class="lightbox-nav lightbox-prev" type="button" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="lightbox-content">
    <img id="lightboxImage" src="" alt="">
    <div class="lightbox-info"><div><h3 id="lightboxProductName"></h3><p id="lightboxProductMeta"></p></div><button id="lightboxOrderButton" class="catalogue-order-button" type="button"><span>Order Now</span><i class="fa-solid fa-arrow-right"></i></button></div>
  </div>
  <button id="lightboxNext" class="lightbox-nav lightbox-next" type="button" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<script type="module" src="js/catalogue.js"></script>
</body>
</html>
